server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: carequeue-backend
  datasource:
    # Default to persistent local file-based database (PostgreSQL mode) for zero-Docker standalone execution.
    # Set SPRING_DATASOURCE_URL to jdbc:postgresql://... for production or Docker.
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/carequeue_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1800000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

carequeue:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  seed-demo-data: ${CAREQUEUE_SEED_DEMO_DATA:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    com.carequeue: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
