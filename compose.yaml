name: carequeue

services:
  postgres:
    image: postgres:16-alpine
    container_name: carequeue-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-carequeue_db}
      POSTGRES_USER: ${POSTGRES_USER:-carequeue_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carequeue_secret_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-carequeue_user} -d ${POSTGRES_DB:-carequeue_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: carequeue_postgres_data
